events {
  worker_connections 1024;
}

http {
  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hide nginx version
  server_tokens off;

  upstream api {
    server api:4000;
  }

  upstream web {
    server web:3000;
  }

  # Redirect HTTP to HTTPS (uncomment when SSL is ready)
  # server {
  #   listen 80;
  #   server_name your-domain.com;
  #   return 301 https://$host$request_uri;
  # }

  server {
    listen 80;
    # listen 443 ssl http2;  # Uncomment when SSL is ready
    server_name _;

    # SSL config (uncomment when you have certificates)
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    # ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    # Max body size for audio uploads
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API proxy
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;

      # Rate limiting at nginx level
      limit_req zone=api burst=20 nodelay;
    }

    # Frontend proxy
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support for Next.js HMR (dev) / real-time features
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # Rate limit zone
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
}
