# Render Blueprint — deploy all services with one click
# https://render.com/docs/blueprint-spec

databases:
  - name: lumi-db
    plan: free
    databaseName: lumi_prod
    user: lumi
    postgresMajorVersion: "16"

services:
  # ---- API (NestJS) ----
  - type: web
    name: lumi-api
    plan: free
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    rootDir: apps/api
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: APP_BASE_URL
        sync: false

  # ---- Web (Next.js) ----
  - type: web
    name: lumi-web
    plan: free
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    rootDir: apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
