# Render Blueprint — deploy with one click
# https://render.com/docs/blueprint-spec
#
# 1. Go to https://dashboard.render.com/select-repo?type=blueprint
# 2. Connect this GitHub repo
# 3. Render reads this file and creates all services
# 4. After first deploy: update CORS_ORIGIN and NEXT_PUBLIC_API_URL
#    with the actual generated .onrender.com URLs

databases:
  - name: lumi-db
    plan: free
    databaseName: lumi_prod
    user: lumi
    postgresMajorVersion: "16"

services:
  # ---- API (NestJS + Fastify + Prisma) ----
  - type: web
    name: lumi-api
    plan: free
    runtime: node
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node --experimental-require-module dist/main
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://lumi-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: APP_BASE_URL
        value: https://lumi-web.onrender.com

  # ---- Web (Next.js) ----
  - type: web
    name: lumi-web
    plan: free
    runtime: node
    rootDir: apps/web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -p 10000
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_URL
        value: https://lumi-api.onrender.com/api
